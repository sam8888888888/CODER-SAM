# Salinan RUJUKAN dari /etc/nginx/sites-available/coder.sam.university.conf di peladen Austria
# (disalin ulang 26 Sep 2026, setelah rilis v0.23.0). Sumber kebenaran tetap berkas di peladen.
#
# Berkas ini dipakai dua hal:
#   1. rujukan bagi operator (jalur /lifeos-api/ dan /apk/ milik aplikasi Personal Life OS, HSTS, dan
#      header keamanan lain ikut tercatat di sini supaya tidak terhapus oleh salinan yang tidak teliti);
#   2. pemasok nilai CSP bagi `deploy/nginx-sync-csp.sh`, yang menyamakan CSP nginx dengan CSP
#      aplikasi tanpa menghafal nilainya.
server {
    listen 80;
    listen [::]:80;
    server_name coder.sam.university;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name coder.sam.university;

    ssl_certificate /etc/letsencrypt/live/coder.sam.university/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coder.sam.university/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers for the platform (added 13 Sep 2026).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Wave 11A (butir 79): CSP untuk jawaban yang disajikan nginx sendiri (mis. halaman galat nginx
    # saat API mati). Nilainya WAJIB sama persis dengan CSP_POLICY di `apps/api/src/wave11a/csp.ts`,
    # karena jawaban dari API juga membawa header ini lewat proxy dan peramban menegakkan IRISAN kedua
    # kebijakan: dua nilai yang berbeda mempersempit kebijakan tanpa sengaja. Terukur 26 Sep 2026:
    # nilai lama (243 karakter, tanpa fonts.googleapis.com/fonts.gstatic.com) memblokir berkas gaya
    # Google Fonts di produksi. Jalankan `deploy/nginx-sync-csp.sh --apply` bila nilainya berbeda.
    # Tanpa `unsafe-eval`/`unsafe-inline`: aturan A6 PRD soal skrip tetap dipegang.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' https://fonts.googleapis.com; form-action 'self'" always;

    # Berkas artefak mentah (butir 49 + 79): yang memutuskan CSP adalah aplikasi, per tipe isi, dan
    # aplikasi SENGAJA menghapus CSP untuk PDF (penampil PDF bawaan Chrome kosong bila `object-src
    # 'none'` berlaku — lihat catatan di csp.ts). Tanpa blok ini nginx menambahkan CSP-nya lagi ke
    # jawaban PDF. Catatan penting nginx: begitu sebuah blok location punya `add_header` sendiri,
    # SEMUA `add_header` warisan digugurkan; karena itu header keamanan lain dikembalikan di bawah —
    # sengaja TANPA CSP, supaya keputusan aplikasi tidak ditimpa.
    location ~ ^/api/v1/artifacts/[^/]+/(raw|download)$ {
        proxy_pass http://127.0.0.1:3402;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # API Akun & Sinkron Personal Life OS (jalur Aaron) — hanya meneruskan ke 127.0.0.1:3500.
    location /lifeos-api/ {
        proxy_pass http://127.0.0.1:3500/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }

    # Unduhan APK Personal Life OS (jalur Aaron) — berkas statis, tanpa proxy.
    # Ditambahkan 23 Sep 2026: APK > 50 MB sehingga tidak bisa lewat Telegram.
    # Catatan jujur: blok ini punya `add_header` sendiri, jadi header keamanan warisan (termasuk CSP)
    # TIDAK berlaku di /apk/. Tidak diubah pada rilis ini karena di luar cakupan PRD Wave 11.
    location /apk/ {
        alias /var/www/lifeos-apk/;
        autoindex off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3402;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
}

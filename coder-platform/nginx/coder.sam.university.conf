server {
    listen 80;
    server_name coder.sam.university;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name coder.sam.university;

    # Aaron: retain existing validated certificate directives here.
    ssl_certificate /etc/letsencrypt/live/coder.sam.university/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coder.sam.university/privkey.pem;

    # Wave 11A (butir 79): header CSP untuk HTML yang disajikan nginx sendiri (mis. halaman galat
    # nginx saat API mati). Nilainya WAJIB sama persis dengan CSP_POLICY di
    # `apps/api/src/wave11a/csp.ts`, karena jawaban HTML dari API juga membawa header ini lewat proxy
    # dan peramban menegakkan irisan kedua kebijakan. Dua nilai yang berbeda akan mempersempit
    # kebijakan tanpa sengaja (mis. font dashboard ikut diblokir), jadi ubah keduanya bersamaan.
    # Tanpa `unsafe-eval`/`unsafe-inline`: aturan A6 PRD soal skrip tetap dipegang.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; connect-src 'self'; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' https://fonts.googleapis.com; form-action 'self'" always;

    location / {
        proxy_pass http://127.0.0.1:3402;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
}
